server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: ai-customer-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:ai_cs}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:ai_cs_dev}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "1"

app:
  jwt:
    secret: ${JWT_SECRET:please-change-this-to-a-long-random-secret-please-change}
    expire-hours: ${JWT_EXPIRE_HOURS:72}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:qwen2}
    embed-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
    timeout-seconds: 120
  llm:
    provider: ${LLM_PROVIDER:moonshot}
    embed-provider: ${EMBED_PROVIDER:auto}
  moonshot:
    api-key: ${MOONSHOT_API_KEY:}
    base-url: ${MOONSHOT_BASE_URL:https://api.moonshot.cn/v1}
    chat-model: ${MOONSHOT_CHAT_MODEL:kimi-k2.6}
    embed-model: ${MOONSHOT_EMBED_MODEL:moonshot-v3-embedding}
    timeout-seconds: ${MOONSHOT_TIMEOUT_SECONDS:120}
  rag:
    chunk-size: 400
    chunk-overlap: 80
    top-k: 4
    similarity-threshold: 0.18
    history-rounds: 3
    max-question-length: 500
    daily-question-limit: 100
    empty-retrieval-reply: 抱歉，当前知识库中没有找到与您问题相关的资料，我无法准确回答。建议您换一种问法，或联系人工客服。
  embed:
    api-key: ${EMBED_API_KEY:}
    base-url: ${EMBED_BASE_URL:https://api.openai.com/v1}
    model: ${EMBED_MODEL:text-embedding-3-small}
  qdrant:
    url: ${QDRANT_URL:}
    collection: ${QDRANT_COLLECTION:knowledge_chunks}
    timeout-seconds: ${QDRANT_TIMEOUT_SECONDS:10}
  redis:
    enabled: ${REDIS_ENABLED:false}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  admin:
    email: ${APP_ADMIN_EMAIL:${ADMIN_EMAIL:admin@company.com}}
    password: "${APP_ADMIN_PASSWORD:${ADMIN_PASSWORD:Admin123!}}"
    reset-password: "${APP_ADMIN_RESET_PASSWORD:${ADMIN_RESET_PASSWORD:false}}"
    log-credentials: "${APP_ADMIN_LOG_CREDENTIALS:${ADMIN_LOG_CREDENTIALS:true}}"
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  security:
    login-max-failures: ${LOGIN_MAX_FAILURES:8}
    login-window-minutes: ${LOGIN_WINDOW_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

