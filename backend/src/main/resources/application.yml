server:
  port: 8080

spring:
  application:
    name: ai-customer-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:ai_cs}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:ai_cs_dev}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "1"

app:
  jwt:
    secret: ${JWT_SECRET:please-change-this-to-a-long-random-secret-please-change}
    expire-hours: ${JWT_EXPIRE_HOURS:72}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:qwen2}
    embed-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
    timeout-seconds: 120
  llm:
    provider: ${LLM_PROVIDER:moonshot}
    embed-provider: ${EMBED_PROVIDER:auto}
  moonshot:
    api-key: ${MOONSHOT_API_KEY:}
    base-url: ${MOONSHOT_BASE_URL:https://api.moonshot.cn/v1}
    chat-model: ${MOONSHOT_CHAT_MODEL:kimi-k2.6}
    embed-model: ${MOONSHOT_EMBED_MODEL:moonshot-v3-embedding}
    timeout-seconds: ${MOONSHOT_TIMEOUT_SECONDS:120}
  rag:
    chunk-size: 400
    chunk-overlap: 80
    top-k: 4
    similarity-threshold: 0.18
    history-rounds: 3
    max-question-length: 500
    daily-question-limit: 100
    empty-retrieval-reply: 抱歉，当前知识库中没有找到与您问题相关的资料，我无法准确回答。建议您换一种问法，或联系人工客服。
