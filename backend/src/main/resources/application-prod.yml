# 容器/生产配置。本地开发不要激活此 profile。
app:
  jwt:
    expire-hours: ${JWT_EXPIRE_HOURS:12}
  admin:
    log-credentials: false
    reset-password: false

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:20}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
